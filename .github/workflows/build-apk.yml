name: Build & Deploy APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Install Expo CLI
        run: npm install -g @expo/cli

      - name: Generate Android project
        run: npx expo prebuild --platform android --clean --no-install

      - name: Bundle JS into assets
        run: |
          mkdir -p android/app/src/main/assets
          npx expo export:embed \
            --platform android \
            --bundle-output android/app/src/main/assets/index.android.bundle \
            --assets-dest android/app/src/main/res \
            --dev false

      - name: Verify bundle exists
        run: |
          BUNDLE=android/app/src/main/assets/index.android.bundle
          if [ ! -f "$BUNDLE" ]; then echo "ERROR: bundle missing!" && exit 1; fi
          echo "Bundle size: $(du -sh $BUNDLE)"

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease -x createBundleReleaseJsAndAssets --no-daemon

      - name: Verify APK contains bundle
        run: |
          APK=android/app/build/outputs/apk/release/app-release-unsigned.apk
          if ! unzip -l "$APK" | grep -q "index.android.bundle"; then
            echo "ERROR: bundle not in APK!" && exit 1
          fi
          echo "Bundle confirmed inside APK ✓"

      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: sry-field-apk
          path: android/app/build/outputs/apk/release/app-release-unsigned.apk
          retention-days: 30

      - name: Upload APK to server
        continue-on-error: true
        env:
          SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          echo "$SSH_KEY" > /tmp/deploy_key
          chmod 600 /tmp/deploy_key
          scp -i /tmp/deploy_key \
            -o StrictHostKeyChecking=no \
            android/app/build/outputs/apk/release/app-release-unsigned.apk \
            root@152.42.210.72:/var/www/html/app/sry-field.apk
          rm /tmp/deploy_key

      - name: Done
        run: echo "APK deployed to https://sry.sarayatec.com/app/sry-field.apk"
